name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: python -m PyInstaller PaprikaLyrics.spec --noconfirm

      - name: Create release zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PaprikaLyrics/* -DestinationPath dist/PaprikaLyrics-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PaprikaLyrics-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
