name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: python -m PyInstaller PaprikaLyrics.spec --noconfirm

      # The same spec, one setting changed: a single self-contained exe as a
      # second download. The folder build is the better experience and the one
      # the README recommends, but "just give me the exe" is a real request and
      # a bare exe lifted out of the folder build cannot start without the
      # _internal/ folder beside it, so a zip-only release cannot answer it.
      - name: Build single-file executable
        env:
          PL_ONEFILE: '1'
        run: python -m PyInstaller PaprikaLyrics.spec --noconfirm --distpath dist-onefile

      - name: Create release zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PaprikaLyrics/* -DestinationPath dist/PaprikaLyrics-windows-x64.zip

      # A tag with a suffix (`v0.2.2-rc1`) is published as a GitHub PRE-release, a
      # plain one (`v0.2.2`) as a normal release — so a build for people to try
      # before it is the release is a naming decision rather than a second
      # workflow. The tag check keeps a manual `workflow_dispatch` run on a
      # branch (where ref_name is a branch, and dashes are common) out of it.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PaprikaLyrics-windows-x64.zip
            dist-onefile/PaprikaLyrics.exe
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
          generate_release_notes: true
